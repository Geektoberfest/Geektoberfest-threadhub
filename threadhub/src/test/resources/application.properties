spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=404E635266556A586E3272357538782F413F44284B6250645367566B5970
jwt.expiration=86400000

rate-limit.login-requests-per-window=5
rate-limit.registration-requests-per-window=5
rate-limit.window-duration=PT1M

# MockMvc requests all arrive with remoteAddr 127.0.0.1, which stands in for the reverse proxy
# in front of the application. Listing it here lets the controller tests drive client identity
# through X-Forwarded-For. Production leaves this list empty, so forwarded headers are ignored.
rate-limit.trusted-proxies=127.0.0.1
