# Test-only configuration. This file sits on the test classpath ahead of
# src/main/resources/application.properties, so it fully replaces it during tests:
# it must therefore carry every property the application context needs, and it must
# NOT reference ${DB_URL}/${DB_USERNAME}/${DB_PASSWORD}, so no running PostgreSQL
# instance is required to execute the suite.

spring.application.name=threadhub

# H2 in-memory database. DB_CLOSE_DELAY=-1 keeps the database alive for the whole JVM
# so contexts shared between test classes do not lose it; MODE=PostgreSQL makes H2 accept
# the PostgreSQL-flavoured SQL the entities generate.
spring.datasource.url=jdbc:h2:mem:threadhub-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate owns the schema in tests. create-drop rebuilds a clean schema for every
# application context, which keeps test classes isolated from each other. This is a
# test-only choice: production keeps spring.jpa.hibernate.ddl-auto=update in
# src/main/resources/application.properties, which is untouched by this change.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# No explicit hibernate.dialect: Hibernate selects H2Dialect automatically, which avoids
# HHH90000025. PostgreSQL keeps its own dialect in the production configuration.

# HS256 requires a key of at least 32 bytes. Development-only fallback value; never a
# production secret, and identical to the value used by src/main/resources.
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000
