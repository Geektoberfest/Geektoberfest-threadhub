spring.application.name=threadhub

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# The schema is owned by the Flyway migrations in classpath:db/migration. Hibernate must never
# modify it; it only verifies at startup that the entities match the migrated schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway runs before the EntityManagerFactory is created, so migrations are always applied before
# Hibernate validates the schema.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
