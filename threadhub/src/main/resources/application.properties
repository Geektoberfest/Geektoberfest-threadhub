spring.application.name=threadhub

# Local development defaults: ./mvnw test and a local run work without exporting anything.
# Environment variables (DB_URL, DB_USERNAME, DB_PASSWORD) still take precedence when set.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/threadhub}
spring.datasource.username=${DB_USERNAME:threadhub_user}
spring.datasource.password=${DB_PASSWORD:threadhub_dev}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Development-only fallback secret (HS256 needs at least 32 bytes). Deployments must always set the
# real JWT_SECRET environment variable; never use this value as a production secret.
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000
